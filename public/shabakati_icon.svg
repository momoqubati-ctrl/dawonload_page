<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stopColor="#1249A8" />
      <stop offset="55%" stopColor="#08256E" />
      <stop offset="100%" stopColor="#030C2E" />
    </radialGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#00E5FF" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="iconRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A5F3FC" />
      <stop offset="40%" stopColor="#00E5FF" />
      <stop offset="100%" stopColor="#0369A1" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="iconRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#EF4444" />
      <stop offset="100%" stopColor="#991B1B" />
    </linearGradient>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
    <linearGradient id="iconGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>
    <linearGradient id="iconPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A855F7" />
      <stop offset="100%" stopColor="#6B21A8" />
    </linearGradient>
    <linearGradient id="iconDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#475569" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>

    <!-- Hexagon Gloss -->
    <linearGradient id="iconHexGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#E0F2FE" />
      <stop offset="100%" stopColor="#BAE6FD" />
    </linearGradient>

    <radialGradient id="iconHexCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="40%" stopColor="#0369A1" />
      <stop offset="100%" stopColor="#082F6D" />
    </radialGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="url(#iconCyan)" strokeWidth="3" strokeOpacity="0.4" />

  <!-- Flowing Waves -->
  <path d="M-40 180 Q 200 40 540 220" stroke="#00E5FF" strokeWidth="18" strokeOpacity="0.15" fill="none" strokeLinecap="round" />
  <path d="M-20 420 Q 300 280 530 460" stroke="#38BDF8" strokeWidth="14" strokeOpacity="0.18" fill="none" strokeLinecap="round" />
  <path d="M60 480 Q 256 360 450 490" stroke="#00E5FF" strokeWidth="8" strokeOpacity="0.25" fill="none" strokeLinecap="round" />

  <!-- 5 Fan Cards -->
  <!-- Card 1: Red -->
  <g transform="translate(112, 175) rotate(-24)">
    <rect x="-42" y="-56" width="84" height="112" rx="22" fill="url(#iconRed)" stroke="#FCA5A5" strokeWidth="3.5" />
    <rect x="-22" y="-28" width="44" height="56" rx="10" fill="none" stroke="#FFFFFF" strokeWidth="9" />
  </g>

  <!-- Card 2: Blue -->
  <g transform="translate(178, 142) rotate(-12)">
    <rect x="-42" y="-56" width="84" height="112" rx="22" fill="url(#iconBlue)" stroke="#BAE6FD" strokeWidth="3.5" />
    <g transform="translate(-18, -18)">
      <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#FFFFFF" />
      <rect x="20" y="0" width="16" height="16" rx="3.5" fill="#FFFFFF" />
      <rect x="0" y="20" width="16" height="16" rx="3.5" fill="#FFFFFF" />
      <rect x="20" y="20" width="16" height="16" rx="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Card 3: Green -->
  <g transform="translate(256, 126)">
    <rect x="-42" y="-56" width="84" height="112" rx="22" fill="url(#iconGreen)" stroke="#A7F3D0" strokeWidth="3.5" />
    <path d="M-20 -18 C-10 -20 10 -20 20 -18 C20 4 10 20 0 25 C-10 20 -20 4 -20 -18 Z" fill="none" stroke="#FFFFFF" strokeWidth="6" strokeLinejoin="round" />
    <path d="M-8 2 L-2 8 L9 -4" stroke="#FFFFFF" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" fill="none" />
  </g>

  <!-- Card 4: Purple -->
  <g transform="translate(334, 142) rotate(12)">
    <rect x="-42" y="-56" width="84" height="112" rx="22" fill="url(#iconPurple)" stroke="#E9D5FF" strokeWidth="3.5" />
    <rect x="-24" y="-14" width="48" height="28" rx="14" fill="none" stroke="#FFFFFF" strokeWidth="5" />
    <line x1="-14" y1="-4" x2="-8" y2="-4" stroke="#FFFFFF" strokeWidth="4" strokeLinecap="round" />
    <line x1="-11" y1="-7" x2="-11" y2="-1" stroke="#FFFFFF" strokeWidth="4" strokeLinecap="round" />
    <circle cx="8" cy="-5" r="2.5" fill="#FFFFFF" />
    <circle cx="14" cy="-2" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Card 5: Dark -->
  <g transform="translate(400, 175) rotate(24)">
    <rect x="-42" y="-56" width="84" height="112" rx="22" fill="url(#iconDark)" stroke="#CBD5E1" strokeWidth="3.5" />
    <circle cx="6" cy="-8" r="12" fill="none" stroke="#FFFFFF" strokeWidth="5" />
    <circle cx="6" cy="-8" r="5" fill="#FFFFFF" />
    <line x1="-12" y1="12" x2="0" y2="-2" stroke="#FFFFFF" strokeWidth="6" strokeLinecap="round" />
    <circle cx="-14" cy="14" r="8" fill="none" stroke="#FFFFFF" strokeWidth="4" />
  </g>

  <!-- Hexagon Badge & Wi-Fi -->
  <g transform="translate(256, 280)">
    <polygon points="0,-82 72,-40 72,42 0,84 -72,42 -72,-40" fill="url(#iconHexGloss)" stroke="#FFFFFF" strokeWidth="7" strokeLinejoin="round" />
    <polygon points="0,-68 58,-34 58,34 0,68 -58,34 -58,-34" fill="url(#iconHexCenter)" stroke="#00E5FF" strokeWidth="3" strokeLinejoin="round" />
    <g transform="translate(0, 6)">
      <path d="M-36 -22 C-18 -38 18 -38 36 -22" stroke="#00E5FF" strokeWidth="8.5" strokeLinecap="round" fill="none" />
      <path d="M-24 -9 C-12 -20 12 -20 24 -9" stroke="#00E5FF" strokeWidth="8.5" strokeLinecap="round" fill="none" />
      <path d="M-12 4 C-6 -2 6 -2 12 4" stroke="#00E5FF" strokeWidth="7" strokeLinecap="round" fill="none" />
      <circle cx="0" cy="18" r="8.5" fill="#00E5FF" />
      <circle cx="0" cy="18" r="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Orbital Ring -->
  <g transform="translate(256, 275) rotate(-14)" filter="url(#iconGlow)">
    <ellipse cx="0" cy="0" rx="155" ry="45" fill="none" stroke="url(#iconRing)" strokeWidth="15" strokeLinecap="round" />
  </g>
  <g transform="translate(256, 275) rotate(-14)">
    <ellipse cx="0" cy="0" rx="155" ry="45" fill="none" stroke="#A5F3FC" strokeWidth="5" strokeOpacity="0.95" strokeLinecap="round" />
  </g>

  <!-- Arabic Typography -->
  <g transform="translate(256, 410)">
    <text x="0" y="0" textAnchor="middle" fill="#FFFFFF" fontSize="54" fontWeight="900" fontFamily="'Cairo', system-ui, sans-serif">
      بوابة شبكتي
    </text>
    <g transform="translate(0, 34)">
      <line x1="-165" y1="-8" x2="-95" y2="-8" stroke="#00E5FF" strokeWidth="4.5" strokeLinecap="round" />
      <text x="0" y="0" textAnchor="middle" fill="#E2E8F0" fontSize="24" fontWeight="700" fontFamily="'Cairo', system-ui, sans-serif">
        للخدمات الرقمية
      </text>
      <line x1="95" y1="-8" x2="165" y2="-8" stroke="#00E5FF" strokeWidth="4.5" strokeLinecap="round" />
    </g>
  </g>
</svg>
